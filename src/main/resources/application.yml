server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: seat-reservation

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seatreservation}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
  health:
    db:
      enabled: true
    redis:
      enabled: true
    
  tracing:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
        step: 10s

logging:
  level:
    com.paytm.seatreservation: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

app:
  reservation:
    default-per-user-limit: 4
    hold-ttl-minutes: 2
    idempotency-ttl-hours: 24
    lock-timeout-ms: 5000
    max-seats-per-request: 4